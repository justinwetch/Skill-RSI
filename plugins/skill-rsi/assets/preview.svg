<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Skill RSI Codex Plugin preview</title>
  <desc id="desc">A compact preview of the Skill RSI plugin console with project state, next loop plan, evidence, and automation context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f7f2"/>
      <stop offset="1" stop-color="#e8ebef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1c20" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="64" y="56" width="1072" height="648" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <g transform="translate(104 96)">
